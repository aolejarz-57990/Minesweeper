<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saper API Client</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        #setup-container {
            margin-bottom: 15px;
            background: #ffffff;
            padding: 15px 20px;
            border: 2px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 250px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #444;
        }

        .input-group input {
            padding: 6px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        #game-container {
            background-color: #c0c0c0;
            padding: 15px;
            border: 4px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none; /* Ukryte do momentu inicjalizacji gry */
        }

        #board {
            display: grid;
            gap: 2px;
            background-color: #808080;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .cell {
            width: 35px;
            height: 35px;
            background-color: #bdbdbd;
            border: 3px solid;
            border-color: #ffffff #7b7b7b #7b7b7b #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
        }

        .cell.revealed {
            background-color: #bdbdbd;
            border: 1px solid #7b7b7b;
        }

        .cell.mine {
            background-color: #ff4d4d;
        }

        /* Kolory cyfr w Saperze */
        .c-1 { color: #0000ff; }
        .c-2 { color: #008000; }
        .c-3 { color: #ff0000; }
        .c-4 { color: #000080; }
        .c-5 { color: #800000; }
        .c-6 { color: #008080; }
        .c-7 { color: #000000; }
        .c-8 { color: #808080; }

        #controls {
            margin-top: 15px;
            text-align: center;
        }

        button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e0e0e0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
        }

        button:active {
            border-color: #808080 #ffffff #ffffff #ffffff;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Saper</h1>

    <!-- Panel sterowania nową grą -->
    <div id="setup-container">
        <div class="input-group">
            <label for="playerName">Nazwa gracza:</label>
            <input type="text" id="playerName" value="Gracz">
        </div>
        <div class="input-group">
            <label for="rowsInput">Wiersze:</label>
            <input type="number" id="rowsInput" value="10" min="5" max="30">
        </div>
        <div class="input-group">
            <label for="colsInput">Kolumny:</label>
            <input type="number" id="colsInput" value="10" min="5" max="30">
        </div>
        <button onclick="initGame()">Nowa Gra (Init)</button>
    </div>
    
    <div id="game-container">
        <div id="board"></div>
    </div>

    <div id="controls">
        <div id="status">Wprowadź dane i kliknij "Nowa Gra".</div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/minesweeper';
        
        let currentSessionId = null;

        async function initGame() {
            try {
                document.getElementById('status').innerText = 'Inicjalizowanie gry...';
                
                const name = document.getElementById('playerName').value;
                const rows = parseInt(document.getElementById('rowsInput').value);
                const cols = parseInt(document.getElementById('colsInput').value);
                
                // Endpoint /init przyjmuje GameInitRequest (rows, cols, name)
                const response = await fetch(`${API_BASE}/init`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rows, cols, name })
                });
                
                if (!response.ok) {
                    throw new Error('Błąd podczas inicjalizacji gry');
                }
                
                // Backend zwraca słownik z polem session_id
                const data = await response.json();
                currentSessionId = data.session_id;
                
                // Pokaż planszę gry
                document.getElementById('game-container').style.display = 'block';
                await fetchGameState();
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Błąd połączenia z API (sprawdź CORS/serwer)';
            }
        }

        async function fetchGameState() {
            if (!currentSessionId) return;

            try {
                const response = await fetch(`${API_BASE}/state/${encodeURIComponent(currentSessionId)}`);
                
                if (!response.ok) {
                    throw new Error('Błąd pobierania stanu gry');
                }
                
                const data = await response.json();
                renderBoard(data.board);
                
                if (data.game_over) {
                    document.getElementById('status').innerText = data.game_win ? 'Wygrana! 🎉' : 'Przegrana! 💥';
                } else {
                    document.getElementById('status').innerText = `Gra w toku... Pozostało do odkrycia: ${data.remaining}`;
                }
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Nie udało się pobrać stanu gry.';
            }
        }

        async function revealCell(row, col) {
            if (!currentSessionId) return;

            try {
                const response = await fetch(`${API_BASE}/reveal/${encodeURIComponent(currentSessionId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ row: row, col: col })
                });

                if (!response.ok) throw new Error('Błąd podczas odkrywania komórki');
                await fetchGameState();
            } catch (error) {
                console.error(error);
            }
        }

        async function flagCell(row, col) {
            if (!currentSessionId) return;

            try {
                const response = await fetch(`${API_BASE}/flag/${encodeURIComponent(currentSessionId)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ row: row, col: col })
                });

                if (!response.ok) throw new Error('Błąd podczas flagowania komórki');
                await fetchGameState();
            } catch (error) {
                console.error(error);
            }
        }

        function renderBoard(boardData) {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            const rowsCount = boardData.length;
            const colsCount = boardData[0].length;
            boardElement.style.gridTemplateColumns = `repeat(${colsCount}, 35px)`;
            boardElement.style.gridTemplateRows = `repeat(${rowsCount}, 35px)`;

            boardData.forEach((row, rowIndex) => {
                row.forEach((cell, colIndex) => {
                    const cellDiv = document.createElement('div');
                    cellDiv.classList.add('cell');

                    cellDiv.addEventListener('click', () => {
                        revealCell(rowIndex, colIndex);
                    });

                    cellDiv.addEventListener('contextmenu', (e) => {
                        e.preventDefault(); 
                        flagCell(rowIndex, colIndex);
                    });

                    if (cell.is_revealed) {
                        cellDiv.classList.add('revealed');
                        if (cell.is_mine) {
                            cellDiv.classList.add('mine');
                            cellDiv.innerText = '💣';
                        } else if (cell.neighbor_mines !== null && cell.neighbor_mines > 0) {
                            cellDiv.innerText = cell.neighbor_mines;
                            cellDiv.classList.add(`c-${cell.neighbor_mines}`);
                        }
                    } else if (cell.has_flag) {
                        cellDiv.innerText = '🚩';
                    }

                    boardElement.appendChild(cellDiv);
                });
            });
        }
    </script>
</body>
</html>
